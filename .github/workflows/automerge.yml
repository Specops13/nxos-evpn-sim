# Merges cursor/* pull requests after CI succeeds, then starts the release.
#
# A merge made with the default GITHUB_TOKEN does not create a push workflow
# run, so this workflow calls Release via workflow_call instead of waiting for
# a push to main. Human merges still release through release.yml's push trigger.
name: Auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    name: Merge after CI
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
    if: >
      startsWith(github.head_ref, 'cursor/') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.result.outputs.merged }}
      sha: ${{ steps.result.outputs.sha }}
    steps:
      - name: Wait for the CI workflow on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Four Android Rust targets plus the desktop packages can run well past
          # half an hour. Leave before the job's own six-hour limit.
          deadline=$((SECONDS + 10800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            json=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" --limit 20 --json status,conclusion,databaseId)
            count=$(echo "$json" | jq 'length')
            pending=$(echo "$json" | jq '[.[] | select(.status != "completed")] | length')
            failed=$(echo "$json" | jq '[.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length')
            echo "CI runs=$count pending=$pending failed=$failed"
            if [ "$count" -gt 0 ] && [ "$pending" -eq 0 ]; then
              if [ "$failed" -gt 0 ]; then
                echo "CI failed; not merging"
                exit 1
              fi
              echo "CI succeeded"
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for CI"
          exit 1
      - name: Squash-merge the pull request
        id: result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR" --repo "$REPO" --json state,headRefOid --jq '{state: .state, sha: .headRefOid}')
          head=$(echo "$state" | jq -r .sha)
          pr_state=$(echo "$state" | jq -r .state)
          if [ "$pr_state" = "MERGED" ]; then
            echo "Already merged; the main push trigger will publish the release"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$head" != "$EXPECTED" ]; then
            echo "PR head moved from $EXPECTED to $head; leaving this run"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --squash --subject "Auto-merge PR #${PR}"
          sha=$(gh pr view "$PR" --repo "$REPO" --json mergeCommit --jq .mergeCommit.oid)
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "Merge did not produce a commit SHA"
            exit 1
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Merged as $sha"

  release:
    name: Release the merge
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.merge.outputs.sha }}
    secrets: inherit

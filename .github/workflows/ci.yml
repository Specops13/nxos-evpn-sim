name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and web bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-bundle
          path: dist
          if-no-files-found: error

  deb:
    name: Linux packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64
      - run: npm ci
      - name: Enable updater signatures when the key is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/prepare-updater.sh
      - name: Build .deb and AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build --bundles deb,appimage
      - name: Upgrade the published v0.1.1 package in place
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/v0.1.1.deb -L "https://github.com/Specops13/nxos-evpn-sim/releases/download/v0.1.1/nxos-evpn-lab_0.1.1_amd64.deb"
          new_deb="$(echo src-tauri/target/release/bundle/deb/*.deb)"
          test "$(dpkg-deb -f /tmp/v0.1.1.deb Package)" = "nxos-evpn-lab"
          test "$(dpkg-deb -f "$new_deb" Package)" = "nxos-evpn-lab"
          sudo dpkg -i /tmp/v0.1.1.deb
          work="$(mktemp -d)"
          dpkg-deb -R "$new_deb" "$work"
          sed -i 's/^Version: .*/Version: 0.1.99/' "$work/DEBIAN/control"
          dpkg-deb -b "$work" /tmp/nxos-evpn-lab_0.1.99_amd64.deb
          sudo dpkg -i /tmp/nxos-evpn-lab_0.1.99_amd64.deb
          test "$(dpkg-query -W -f '${Version}' nxos-evpn-lab)" = "0.1.99"
          test -x /usr/bin/nxos-evpn-sim
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  e2e:
    name: Mobile layout
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mobile-screenshots
          path: e2e-results
          if-no-files-found: ignore

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit the Tauri crate
        working-directory: src-tauri
        run: cargo audit

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK and NDK
        run: bash scripts/android-sdk.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: npm ci
      - name: Initialize the Android project
        run: npx tauri android init --ci --skip-targets-install
      - name: Require stable compileSdk 36
        run: |
          set -euo pipefail
          if grep -R --include='*.kts' --include='*.gradle' -n -E 'compileSdk = 37|targetSdk = 37|android-37' src-tauri/gen/android; then
            echo "Generated Android project requests API 37. @tauri-apps/cli must stay on 2.11.x."
            exit 1
          fi
          grep -n -E 'compileSdk|targetSdk|minSdk' src-tauri/gen/android/app/build.gradle.kts
      - name: Harden the Android manifest
        run: bash scripts/android-harden.sh
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/android-signing.sh
      - name: Build a universal APK
        run: npx tauri android build --apk --ci
      - name: Collect the signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p apk-out
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No signed APK was produced"
            find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          chosen=""
          for f in "${apks[@]}"; do
            case "$f" in
              *universal*) chosen="$f" ;;
            esac
          done
          if [ -z "$chosen" ]; then
            chosen="${apks[0]}"
          fi
          cp "$chosen" apk-out/nxos-evpn-lab-android.apk
          curl -fsSL -o /tmp/v0.1.1.apk -L "https://github.com/Specops13/nxos-evpn-sim/releases/download/v0.1.1/nxos-evpn-lab-android.apk"
          ANDROID_KEYSTORE_BASE64="${ANDROID_KEYSTORE_BASE64:-}" \
            ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:-}" \
            ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:-}" \
            ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-}" \
            bash scripts/android-rotate.sh apk-out/nxos-evpn-lab-android.apk
          bash scripts/verify-apk.sh apk-out/nxos-evpn-lab-android.apk /tmp/v0.1.1.apk
          ls -lh apk-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: apk-out/*.apk
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: apk-out/nxos-evpn-lab-android.apk

# Reusable release build. Callers pass the commit to publish.
#
# Do not add a push trigger here. Merges performed with GITHUB_TOKEN do not
# emit push events, and a push trigger plus workflow_call would publish twice
# when a person merges by hand. release-dispatch.yml owns push and tag events.
name: Release

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to build and tag
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Choose version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version and tag
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          git checkout --detach "$TARGET"

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            mapfile -t TAGS < <(git tag -l 'v[0-9]*')
            PKG=$(node -p "require('./package.json').version")
            TAG_LIST=""
            if [ "${#TAGS[@]}" -gt 0 ]; then
              TAG_LIST="${TAGS[*]}"
            fi
            export PKG TAG_LIST
            VERSION=$(node --input-type=module -e '
              import { nextReleaseVersion } from "./scripts/next-version.js";
              const tags = (process.env.TAG_LIST || "").split(/\s+/).filter(Boolean);
              console.log(nextReleaseVersion(process.env.PKG, tags));
            ')
            CURRENT=$(git rev-parse HEAD)
            MAIN=$(git rev-parse origin/main)
            if [ "$CURRENT" != "$MAIN" ]; then
              echo "Refusing to version $TARGET because origin/main is $MAIN"
              exit 1
            fi
            if [ "$PKG" != "$VERSION" ]; then
              node --input-type=module -e '
                import { setProjectVersion } from "./scripts/set-version.js";
                setProjectVersion(process.cwd(), process.argv[1]);
              ' "$VERSION"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
              git commit -m "chore: release v${VERSION}"
              git push origin HEAD:main
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian package and AppImage
            os: ubuntu-24.04
            bundles: deb,appimage
            artifact: release-linux
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows installer
            os: windows-latest
            bundles: nsis
            artifact: release-exe
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
          - name: Web bundle
            os: ubuntu-24.04
            bundles: none
            artifact: release-web
            paths: |
              nxos-evpn-lab-web.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: matrix.bundles != 'none'
      - name: Install Tauri Linux dependencies
        if: matrix.bundles != 'none' && matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64
      - run: npm ci
      - name: Enable updater signatures when the key is configured
        if: matrix.bundles != 'none'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/prepare-updater.sh
      - name: Build desktop bundle
        if: matrix.bundles != 'none'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Zip the web bundle
        if: matrix.bundles == 'none'
        run: |
          npm run build
          (cd dist && zip -r ../nxos-evpn-lab-web.zip .)
      - name: Stage updater signatures
        if: matrix.bundles != 'none'
        shell: bash
        run: |
          mkdir -p updater-sigs
          find src-tauri/target/release/bundle -type f -name '*.sig' -exec cp {} updater-sigs/ \;
          ls -lh updater-sigs || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.bundles != 'none'
        with:
          name: ${{ matrix.artifact }}-sigs
          path: updater-sigs/*.sig
          if-no-files-found: ignore
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ matrix.paths }}

  android:
    name: Android APK
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK and NDK
        run: bash scripts/android-sdk.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: npm ci
      - name: Initialize the Android project
        run: npx tauri android init --ci --skip-targets-install
      - name: Require stable compileSdk 36
        run: |
          set -euo pipefail
          if grep -R --include='*.kts' --include='*.gradle' -n -E 'compileSdk = 37|targetSdk = 37|android-37' src-tauri/gen/android; then
            echo "Generated Android project requests API 37. @tauri-apps/cli must stay on 2.11.x."
            exit 1
          fi
          grep -n -E 'compileSdk|targetSdk|minSdk' src-tauri/gen/android/app/build.gradle.kts
      - name: Harden the Android manifest
        run: bash scripts/android-harden.sh
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/android-signing.sh
      - name: Build a universal APK
        run: npx tauri android build --apk --ci
      - name: Collect the signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p apk-out
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No signed APK was produced"
            find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          chosen=""
          for f in "${apks[@]}"; do
            case "$f" in
              *universal*) chosen="$f" ;;
            esac
          done
          if [ -z "$chosen" ]; then
            chosen="${apks[0]}"
          fi
          cp "$chosen" apk-out/nxos-evpn-lab-android.apk
          curl -fsSL -o /tmp/v0.1.1.apk -L "https://github.com/Specops13/nxos-evpn-sim/releases/download/v0.1.1/nxos-evpn-lab-android.apk"
          ANDROID_KEYSTORE_BASE64="${ANDROID_KEYSTORE_BASE64:-}" \
            ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:-}" \
            ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:-}" \
            ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-}" \
            bash scripts/android-rotate.sh apk-out/nxos-evpn-lab-android.apk
          bash scripts/verify-apk.sh apk-out/nxos-evpn-lab-android.apk /tmp/v0.1.1.apk
          ls -lh apk-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apk
          path: apk-out/*.apk
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: apk-out/nxos-evpn-lab-android.apk

  publish:
    name: Publish GitHub Release
    needs: [prepare, build, android]
    if: needs.prepare.outputs.publish == 'true' && needs.build.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          find release-assets -type f -print
          notes=$(printf 'Automated release of NX-OS EVPN Lab %s.\n\nCommit: %s\n\nAssets: Windows NSIS installer, Debian package, AppImage, Android APK (sideload; see docs/ANDROID.md), and the static web bundle.\n\nUpgrades: docs/UPGRADING.md. Windows and AppImage self-update only when latest.json is attached.' "v${VERSION}" "${SHA}")
          node --input-type=module -e '
            import { readdirSync, readFileSync, writeFileSync } from "node:fs";
            import { join } from "node:path";
            import { buildLatestJson } from "./scripts/latest-json.js";
            const root = "release-assets";
            const signatures = [];
            for (const name of readdirSync(root)) {
              if (!name.endsWith(".sig")) continue;
              signatures.push({
                name: name.slice(0, -4),
                signature: readFileSync(join(root, name), "utf8"),
              });
            }
            const manifest = buildLatestJson({
              version: process.env.VERSION,
              notes: "NX-OS EVPN Lab " + process.env.VERSION,
              pubDate: new Date().toISOString(),
              repo: process.env.GH_REPO,
              signatures,
            });
            if (!manifest) {
              console.log("::warning::No updater signatures were uploaded. latest.json was not published.");
            } else {
              writeFileSync(join(root, "latest.json"), JSON.stringify(manifest, null, 2) + "\n");
              console.log("Wrote latest.json for " + Object.keys(manifest.platforms).join(", "));
            }
          '
          (
            cd release-assets
            find . -type f ! -name '*.sig' ! -name SHA256SUMS -printf '%P\n' | sort | while IFS= read -r rel; do
              sha256sum "$rel" | awk -v name="$(basename "$rel")" '{print $1 "  " name}'
            done | sort -k2 > SHA256SUMS
          )
          mapfile -t files < <(find release-assets -type f ! -name '*.sig' | sort)
          gh release create "v${VERSION}" "${files[@]}" \
            --target "${SHA}" \
            --title "v${VERSION}" \
            --notes "${notes}"
          gh release view "v${VERSION}" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'

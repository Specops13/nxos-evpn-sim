name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: --bundles deb
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build and attach installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NX-OS EVPN Lab ${{ github.ref_name }}
          releaseBody: |
            Browser bundle, Windows NSIS installer (.exe), and Debian package for the NX-OS EVPN / VXLAN lab.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Zip the web bundle
        if: matrix.platform == 'ubuntu-24.04'
        run: (cd dist && zip -r ../nxos-evpn-lab-web.zip .)
      - name: Attach the static web bundle
        if: matrix.platform == 'ubuntu-24.04'
        uses: softprops/action-gh-release@v2
        with:
          files: nxos-evpn-lab-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

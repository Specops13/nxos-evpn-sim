[package]
name = "nxos-evpn-sim"
version = "0.1.2"
description = "NX-OS EVPN / VXLAN fabric lab"
authors = ["NX-OS EVPN Lab"]
edition = "2021"

# Android links this crate as a shared library. The `_lib` suffix keeps the
# library filename distinct from the desktop binary on Windows.
[lib]
name = "nxos_evpn_sim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
